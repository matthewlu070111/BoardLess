name: Sync BoardLess upstream

on:
  workflow_dispatch:
  # Automatic checks are opt-in. Repository owners can uncomment these lines.
  # schedule:
  #   - cron: "17 3 * * *" # Daily at 03:17 UTC.

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-boardless-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: matthewlu070111/BoardLess
  UPSTREAM_BRANCH: main
  UPDATE_BRANCH: boardless-upstream-update
  UPSTREAM_STATE_FILE: .boardless-upstream-commit

jobs:
  sync:
    # The canonical repository publishes updates; deployed copies consume them.
    if: github.repository != 'matthewlu070111/BoardLess'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the deployed repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Replace with the latest upstream snapshot
        id: sync
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove boardless-upstream 2>/dev/null || true
          git remote add boardless-upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags boardless-upstream "${UPSTREAM_BRANCH}"
          git checkout -B "${UPDATE_BRANCH}" "origin/${TARGET_BRANCH}"

          latest_upstream_commit="$(git rev-parse "boardless-upstream/${UPSTREAM_BRANCH}")"
          previous_upstream_commit=""
          if [[ -f "${UPSTREAM_STATE_FILE}" ]]; then
            previous_upstream_commit="$(tr -d '[:space:]' < "${UPSTREAM_STATE_FILE}")"
          fi

          if [[ "${previous_upstream_commit}" == "${latest_upstream_commit}" ]]; then
            echo "Already synchronized with upstream commit ${latest_upstream_commit}."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Replace the complete tracked tree. GitHub does not allow the
          # repository GITHUB_TOKEN to create or update workflow files, so keep
          # the deployed repository's workflow directory as the sole exception.
          # Upstream workflow changes must be copied manually.
          git read-tree --reset -u "boardless-upstream/${UPSTREAM_BRANCH}"
          if ! git diff --quiet \
            "origin/${TARGET_BRANCH}" \
            "boardless-upstream/${UPSTREAM_BRANCH}" \
            -- .github/workflows; then
            echo "::warning::.github/workflows differs from upstream and was preserved. Copy workflow updates manually."
          fi
          git rm -r --force --quiet --ignore-unmatch .github/workflows
          git checkout "origin/${TARGET_BRANCH}" -- .github/workflows

          printf '%s\n' "${latest_upstream_commit}" > "${UPSTREAM_STATE_FILE}"
          git add --all
          git commit -m "Update BoardLess from upstream ${latest_upstream_commit:0:12}"

          git push --force origin "HEAD:refs/heads/${UPDATE_BRANCH}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Create or update the upstream update pull request
        if: steps.sync.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list \
            --base "${TARGET_BRANCH}" \
            --head "${UPDATE_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "${existing_pr}" ]]; then
            echo "Updated existing pull request #${existing_pr}."
            exit 0
          fi

          gh pr create \
            --base "${TARGET_BRANCH}" \
            --head "${UPDATE_BRANCH}" \
            --title "Update BoardLess from upstream" \
            --body $'This pull request replaces the tracked repository snapshot with the latest `matthewlu070111/BoardLess` upstream commit. `.github/workflows/` is preserved because GitHub does not permit `GITHUB_TOKEN` to update workflow files.\n\nOther downstream-only tracked files and modifications will be removed. Review the full diff and checks before merging. Merging into the production branch will trigger Cloudflare Workers Builds.'
